<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">Wheathampstead Observatory telescope</title>
  <desc id="desc">A telescope aimed toward a crescent Moon at night.</desc>
  <defs>
    <linearGradient id="bg" x1="8" y1="5" x2="57" y2="61" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#07111f" />
      <stop offset="1" stop-color="#12355d" />
    </linearGradient>
    <linearGradient id="tube" x1="16" y1="23" x2="49" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#d9e6f1" />
      <stop offset="0.58" stop-color="#fff" />
      <stop offset="1" stop-color="#9fb7cc" />
    </linearGradient>
    <mask id="moon">
      <rect width="64" height="64" fill="#000" />
      <circle cx="49" cy="7" r="4.5" fill="#fff" />
      <circle cx="51" cy="5.5" r="4.2" fill="#000" />
    </mask>
  </defs>

  <rect x="1" y="1" width="62" height="62" rx="15" fill="url(#bg)" />
  <circle cx="49" cy="7" r="4.5" fill="#e5f8ff" mask="url(#moon)" />
  <g fill="#d9f7ff">
    <circle cx="13" cy="12" r="1" />
    <circle cx="28" cy="8" r="0.7" opacity="0.75" />
    <circle cx="53" cy="27" r="0.8" opacity="0.7" />
    <path d="M19 19h3M20.5 17.5v3" stroke="#d9f7ff" stroke-width="0.7" stroke-linecap="round" />
  </g>

  <path d="M1 55c13-6 24-6 35-2c10 3 18 1 27-3v13H1z" fill="#06101c" opacity="0.94" />
  <g stroke="#b8cadb" stroke-width="3" stroke-linecap="round">
    <path d="M30 39L19 55" />
    <path d="M32 40v17" />
    <path d="M34 39l10 16" />
  </g>
  <path d="M28 37h8l-1 4h-6z" fill="#d4e2ed" />

  <g transform="rotate(-27 32 28)">
    <rect x="12" y="26" width="6" height="4" rx="1.5" fill="#7891a8" />
    <rect x="16" y="23" width="31" height="9" rx="2.3" fill="url(#tube)" />
    <rect x="41" y="23" width="3" height="9" fill="#6f889f" />
    <rect x="45" y="21.5" width="5.5" height="12" rx="2" fill="#38bde1" />
    <path d="M29 23v-3h9v3" fill="none" stroke="#91a8bc" stroke-width="1.6" stroke-linejoin="round" />
  </g>
  <circle cx="32" cy="33" r="4.3" fill="#10233b" stroke="#d8e7f2" stroke-width="1.8" />
  <circle cx="32" cy="33" r="1.2" fill="#4dd5ee" />
  <rect x="1" y="1" width="62" height="62" rx="15" fill="none" stroke="#67e8f9" stroke-width="1.2" opacity="0.45" />
</svg>
